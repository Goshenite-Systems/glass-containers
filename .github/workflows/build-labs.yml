---
name: Build Goshenite Lab Images
on:
  push:
    branches: [main]
    paths:
      - 'labs/**'
      - 'generate-labs.py'
      - 'references/**'
      - '.github/workflows/build-labs.yml'
  pull_request:
    paths:
      - 'labs/**'
      - 'generate-labs.py'
  workflow_dispatch:
  schedule:
    - cron: '40 7 * * *'   # daily 07:40 UTC (imports Kali rolling updates)

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: gen
        run: |
          python3 generate-labs.py
          labs=$(ls -1 labs)
          matrix=$(echo "$labs" | jq -R -s -c 'split("\n") | map(select(length>0)) | {lab: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: generate
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.lab }}-lab
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: labs/${{ matrix.lab }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/goshenite-systems/${{ matrix.lab }}-lab:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign ${{ matrix.lab }}-lab
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_YES: "true"
        run: |
          cosign sign --yes "ghcr.io/goshenite-systems/${{ matrix.lab }}-lab@${{ steps.build.outputs.digest }}"

  pull-request:
    needs: generate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build (no push) ${{ matrix.lab }}-lab
        uses: docker/build-push-action@v6
        with:
          context: .
          file: labs/${{ matrix.lab }}/Dockerfile
          push: false
          tags: ghcr.io/goshenite-systems/${{ matrix.lab }}-lab:pr
