---
name: Build Goshenite Lab Images
on:
  push:
    branches: [main]
    paths:
      - 'labs/**'
      - 'generate-labs.py'
      - 'references/**'
      - '.github/workflows/build-labs.yml'
  pull_request:
    paths:
      - 'labs/**'
      - 'generate-labs.py'
  workflow_dispatch:
  schedule:
    - cron: '40 7 * * *'   # daily 07:40 UTC (imports Kali rolling updates)

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: gen
        run: |
          python3 generate-labs.py
          labs=$(ls -1 labs)
          matrix=$(echo "$labs" | jq -R -s -c 'split("\n") | map(select(length>0)) | {lab: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: generate
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate.outputs.matrix) }}
    steps:
      - name: Build + push + sign ${{ matrix.lab }}-lab
        uses: ublue-os/build-action@1.0.1
        with:
          image_name: ${{ matrix.lab }}-lab
          image_variant: main
          version: latest
          signing_key: ${{ secrets.SIGNING_SECRET }}
          extra_build_args: |
            --file=labs/${{ matrix.lab }}/Dockerfile
          push_container: true

  pull-request:
    needs: generate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate.outputs.matrix) }}
    steps:
      - name: Build (no push) ${{ matrix.lab }}-lab
        uses: ublue-os/build-action@1.0.1
        with:
          image_name: ${{ matrix.lab }}-lab
          image_variant: main
          version: pr
          signing_key: ${{ secrets.SIGNING_SECRET }}
          extra_build_args: |
            --file=labs/${{ matrix.lab }}/Dockerfile
          push_container: false
